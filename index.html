  --input-line:#4B7154; --shadow:none; --dash:#4B7154; --amount:#F9F9F9; --ibub-line:#4B7154; --search-bg:rgba(25,36,33,.95); --kb-bg:#2C3230; --key:#6B6F6D; --key-fn:#46504C; --key-ink:#FFFFFF; --key-shadow:rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}

  display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}

.stage{display:flex;flex-direction:column;align-items:center;gap:14px}

.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}

/* ---------- hero with wandering glow ---------- */
.hero{position:absolute;left:0;right:0;top:0;height:366px;overflow:hidden;background:#0B1824;z-index:0}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}

  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}

  padding:0 18px 0 var(--cpad,169px);scroll-snap-type:x mandatory;scroll-padding-left:var(--cpad,169px);overscroll-behavior-x:contain}

@keyframes emerge{from{transform:translateX(calc(-90px - var(--i)*87px)) scale(.25);opacity:0;filter:blur(6px)}60%{opacity:1;filter:blur(0)}to{transform:none;opacity:1;filter:none}}
.art.gen::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.22),transparent 55%)}

.art.uzt::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18) 0 14px,transparent 15px),radial-gradient(circle at 20% 110%,rgba(255,255,255,.12) 0 26px,transparent 27px)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:30px 18px 0}

.vs{touch-action:none;cursor:grab}

.promo{gap:10px;padding-top:18px}
.promo .bn{width:340px;height:70px;border-radius:16px;overflow:hidden}
.promo img{width:340px;height:70px;object-fit:cover;display:block}

/* ---------- tab bar ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;height:114px;z-index:15;background:var(--nav-bg);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--nav-line);transition:background-color .3s}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);height:76px;padding:0 8px}

.toast{position:absolute;left:50%;bottom:128px;z-index:30;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;padding:10px 16px;border-radius:14px;white-space:nowrap;transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}

.search{position:absolute;inset:0;z-index:40;pointer-events:none;--stop:58px}
.search.open{pointer-events:auto}
.s-bg{position:absolute;inset:0;background:var(--search-bg);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);opacity:0;transition:opacity .35s ease}

  transition:left .5s cubic-bezier(.2,.9,.25,1),top .5s cubic-bezier(.2,.9,.25,1),width .5s cubic-bezier(.2,.9,.25,1),height .5s cubic-bezier(.2,.9,.25,1),border-radius .5s,box-shadow .5s,opacity .2s}

.s-field{flex:1;min-width:0;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;display:flex;align-items:center;opacity:0;transition:opacity .25s .15s}

.s-clear{flex:none;width:22px;height:22px;margin-right:12px;border-radius:50%;background:var(--muted);color:var(--surface);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}

.s-body{position:absolute;left:0;right:0;bottom:var(--kb-h,330px);overflow-y:auto;scrollbar-width:none;padding:0 18px 16px}

.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--surface);border:1px solid var(--border);font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px}
.chip svg{color:var(--muted)}

.res b{display:block;font-size:16px;font-weight:600;color:var(--ink)}

.stg{opacity:0;transform:translateY(14px)}

/* ---------- press animation ---------- */
const phone=document.getElementById('phone');
let pressed=null,startX=0,startY=0;
phone.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.tap'); if(!t) return;
  pressed=t;startX=e.clientX;startY=e.clientY;t.classList.add('is-pressed');
});
const release=()=>{if(pressed){pressed.classList.remove('is-pressed');pressed=null}};
phone.addEventListener('pointermove',e=>{if(pressed&&Math.hypot(e.clientX-startX,e.clientY-startY)>8)release()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>phone.addEventListener(ev,release));
phone.addEventListener('scroll',release,true);

/* toast */
const toastEl=document.getElementById('toast');let toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1300)}
phone.addEventListener('click',e=>{const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast)});

/* tabs */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
  if(!t.textContent.includes('Main'))toast(t.textContent.trim()+' — в прототипе пока только главная');
}));

/* balance hide */
const amount=document.getElementById('amount');let hidden=false;
document.getElementById('eyeBtn').addEventListener('click',()=>{
  hidden=!hidden;amount.innerHTML=hidden?'<span class="mask" style="font-size:32px;margin:0">••• •••</span><span>UZS</span>':'1 587 632<span>UZS</span>';
});

/* ---------- theme toggle on avatar ---------- */
const root=document.documentElement;
function isDark(){const a=root.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
try{const s=localStorage.getItem('iy-theme');if(s)root.setAttribute('data-theme',s)}catch(e){}
document.getElementById('avatar').addEventListener('click',e=>{
  const next=isDark()?'light':'dark';
  const apply=()=>{root.setAttribute('data-theme',next);try{localStorage.setItem('iy-theme',next)}catch(_){}};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!document.startViewTransition||reduce){apply();return}
  const r=e.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const end=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>{
    root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${end}px at ${x}px ${y}px)`]},{duration:650,easing:'cubic-bezier(.65,0,.35,1)',pseudoElement:'::view-transition-new(root)'});

(function(){
  const vs=document.getElementById('vs'),slides=[...vs.querySelectorAll('.slide')],dots=[...vs.querySelectorAll('.dots i')];
  const N=slides.length,H=()=>vs.clientHeight;let idx=0,drag=null,timer=null,lastPos=slides.map((_,i)=>i);
  function rel(i){let d=(i-idx)%N;if(d<0)d+=N;if(d>N/2)d-=N;return d}
  function render(offset=0){
    slides.forEach((s,i)=>{const p=rel(i);const jump=Math.abs(p-lastPos[i])>1;s.classList.toggle('jump',jump);
      s.style.transform=`translateY(${p*100+offset/H()*100}%)`;lastPos[i]=p;});
    if(slides.some(s=>s.classList.contains('jump'))){slides[0].offsetHeight;slides.forEach(s=>s.classList.remove('jump'))}
    dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
  }
  function go(dir){idx=(idx+dir+N)%N;render()}
  function start(){stop();timer=setInterval(()=>{if(!drag&&!document.hidden&&!document.getElementById('search').classList.contains('open'))go(1)},3000)}
  function stop(){clearInterval(timer)}
  render();start();
  vs.addEventListener('pointerdown',e=>{drag={y:e.clientY,x:e.clientX,dy:0,moved:false};vs.classList.remove('anim');stop();vs.setPointerCapture(e.pointerId)});
  vs.addEventListener('pointermove',e=>{if(!drag)return;drag.dy=e.clientY-drag.y;
    if(Math.abs(drag.dy)>6){drag.moved=true;vs.classList.remove('is-pressed')}
    if(drag.moved)slides.forEach((s,i)=>s.style.transform=`translateY(${rel(i)*100+drag.dy/H()*100}%)`)});
  const end=()=>{if(!drag)return;vs.classList.add('anim');
    if(drag.moved){if(drag.dy<-H()*.18)go(1);else if(drag.dy>H()*.18)go(-1);else render()}
    else toast(slides[idx].dataset.name);
    drag=null;start()};
  vs.addEventListener('pointerup',end);vs.addEventListener('pointercancel',end);
  let wheelLock=0;vs.addEventListener('wheel',e=>{e.preventDefault();const now=Date.now();if(now-wheelLock<450||Math.abs(e.deltaY)<8)return;wheelLock=now;go(e.deltaY>0?1:-1);start()},{passive:false});
  vs.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){go(1);start()}if(e.key==='ArrowUp'){go(-1);start()}});
})();

/* ---------- wandering glow in the hero ---------- */
(function(){
  const c=document.getElementById('glow'),ctx=c.getContext('2d'),hero=document.getElementById('hero');
  let W,Hh,dpr;function size(){dpr=Math.min(2,devicePixelRatio||1);W=hero.clientWidth;Hh=hero.clientHeight;c.width=W*dpr;c.height=Hh*dpr}
  size();addEventListener('resize',size);
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const blobs=[
    {r:240,col:[24,190,100],a:1},{r:190,col:[40,210,120],a:.85},{r:170,col:[12,150,120],a:.8},{r:150,col:[60,200,90],a:.6}
  ].map(b=>({...b,x:rnd(.2,.8),y:rnd(.25,.75),tx:rnd(.1,.9),ty:rnd(.15,.85),sp:rnd(.014,.022),ph:rnd(0,6.28)}));
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const g0=ctx.createRadialGradient(W/2,Hh/2,0,W/2,Hh/2,W*.85);
    g0.addColorStop(0,'#0B2A2A');g0.addColorStop(1,'#08111C');ctx.fillStyle=g0;ctx.fillRect(0,0,W,Hh);
    ctx.globalCompositeOperation='lighter';
    for(const b of blobs){
      if(!reduce){b.x+=(b.tx-b.x)*b.sp;b.y+=(b.ty-b.y)*b.sp;
        if(Math.hypot(b.tx-b.x,b.ty-b.y)<.05){b.tx=rnd(0,1);b.ty=rnd(.05,.95);b.sp=rnd(.014,.024)}b.ph+=.02}
      const x=b.x*W,y=b.y*Hh,rr=b.r*(1+.18*Math.sin(b.ph)),g=ctx.createRadialGradient(x,y,0,x,y,rr);const pulse=.8+.2*Math.sin(b.ph*1.3);
      const [r,gg,bb]=b.col;
      g.addColorStop(0,`rgba(${r},${gg},${bb},${b.a*.6*pulse})`);g.addColorStop(.45,`rgba(${r},${gg},${bb},${b.a*.25*pulse})`);g.addColorStop(1,`rgba(${r},${gg},${bb},0)`);
      ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
    }
    ctx.globalCompositeOperation='source-over';
    if(!reduce)requestAnimationFrame(frame);
  }
  frame();
})();

/* ---------- cards: fixed "All Cards", cards are absorbed into / born from it ---------- */
(function(){
  const row=document.getElementById('cardrow'),pill=document.getElementById('allCards'),sc=document.getElementById('cscroll');
  const cards=[...sc.querySelectorAll('.mini')];let cpad=169,raf=0;
  function layout(){cpad=pill.offsetLeft+pill.offsetWidth+12;row.style.setProperty('--cpad',cpad+'px');update()}
  function update(){raf=0;let glow=0;
    for(const c of cards){
      const x=c.offsetLeft-sc.scrollLeft;            /* card's left edge inside the row */
      const p=Math.max(0,Math.min(1,(cpad-x)/(c.offsetWidth+12)));
      if(p<=0){c.style.transform='';c.style.opacity='';c.style.filter='';continue}
      const pull=(cpad-x)*0.35;                      /* drift toward the pill's centre */
      c.style.transform=`translateX(${pull}px) scale(${1-.6*p}) rotateY(${p*35}deg)`;
      c.style.opacity=String(1-p*p);c.style.filter=`blur(${(p*4).toFixed(2)}px) saturate(${1+p}) brightness(${1+.4*p})`;
      if(p<1)glow=Math.max(glow,Math.sin(p*Math.PI));
    }
    pill.style.boxShadow=glow?`0 0 ${18*glow}px ${3*glow}px rgba(76,234,76,${.45*glow})`:'';
    pill.style.transform=pill.classList.contains('is-pressed')?'':(glow?`scale(${1+.04*glow})`:'');
  }
  sc.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(update)},{passive:true});
  addEventListener('resize',layout);document.fonts&&document.fonts.ready.then(layout);layout();
  sc.style.perspective='400px';
})();

      `<div class="kb-row r3"><button class="key fn" data-k="shift" aria-label="Shift"><svg width="20" height="20" viewBox="0 0 20 20" fill="${shift?'currentColor':'none'}"><path d="M10 3 3 10h4v6h6v-6h4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>${[...rows[2]].map(k).join('')}<button class="key fn" data-k="del" aria-label="Удалить"><svg width="24" height="18" viewBox="0 0 24 18" fill="none"><path d="M8 2h13v14H8L2 9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m11 6 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>`+
      `<div class="kb-row r4"><button class="key fn" data-k="lang">${lang==='ru'?'EN':'RU'}</button><button class="key fn" data-k="globe" aria-label="Язык"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 10h15M10 2.5c2.2 2.3 2.2 12.7 0 15M10 2.5c-2.2 2.3-2.2 12.7 0 15" stroke="currentColor" stroke-width="1.4"/></svg></button><button class="key wide" data-k=" " style="font-size:16px">${lang==='ru'?'Пробел':'space'}</button><button class="key go" data-k="go">${lang==='ru'?'Найти':'Search'}</button></div>`;
  }
  function type(k){
    if(k==='shift'){shift=!shift;renderKb();return}
    if(k==='lang'||k==='globe'){lang=lang==='ru'?'en':'ru';renderKb();return}
    if(k==='del'){q=q.slice(0,-1)}
    else if(k==='go'){if(q)toast('Поиск: '+q);return}
    else{q+=k;if(shift){shift=false;renderKb()}}
    renderField();renderBody(false);
  }
  /* key press visuals + preview bubble */
  kb.addEventListener('pointerdown',e=>{const key=e.target.closest('.key');if(!key)return;e.preventDefault();
    key.classList.add('down');const k=key.dataset.k;
    if(k.length===1&&k!==' '){const p=document.createElement('span');p.className='pop';p.textContent=k;key.appendChild(p)}
    type(k);
    const up=()=>{key.classList.remove('down');key.querySelector('.pop')?.remove();removeEventListener('pointerup',up);removeEventListener('pointercancel',up)};
    addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
  function show(){
    if(open)return;open=true;q='';shift=true;lang='ru';
    renderField();renderBody(true);renderKb();
    const r=btnRect();bar.style.transition='none';place(r,r.h/2);bar.style.opacity='1';bar.offsetWidth;bar.style.transition='';
    btn.style.visibility='hidden';
    const T=top();cancel.style.top=T+'px';
    S.setAttribute('aria-hidden','false');st.classList.add('over');
    requestAnimationFrame(()=>{S.classList.add('open');
      const cw=cancel.offsetWidth+14;place({l:18,t:T,w:ph.offsetWidth-36-cw,h:44},14);
      body.style.top=(T+56)+'px';
      requestAnimationFrame(()=>S.style.setProperty('--kb-h',kb.offsetHeight+'px'));
    });
  }
  function hide(){
    if(!open)return;open=false;S.classList.remove('open');st.classList.remove('over');S.setAttribute('aria-hidden','true');
    place(btnRect(),20);
    setTimeout(()=>{if(!open){btn.style.visibility='';bar.style.opacity='0'}},480);
  }
  bar.style.opacity='0';
  btn.addEventListener('click',show);
  cancel.addEventListener('click',hide);
  clear.addEventListener('click',()=>{q='';renderField();renderBody(false)});
  body.addEventListener('click',e=>{const c=e.target.closest('[data-q]');if(c){q=c.dataset.q;renderField();renderBody(false)}});
  addEventListener('keydown',e=>{if(!open)return;
    if(e.key==='Escape'){hide();return}
    if(e.key==='Backspace'){type('del');e.preventDefault();return}
    if(e.key==='Enter'){type('go');return}
    if(e.key.length===1&&!e.metaKey&&!e.ctrlKey){q+=e.key;renderField();renderBody(false);e.preventDefault()}});
})();

/* ---------- fit the phone frame to the window ---------- */
(function(){const w=document.getElementById('wrap');function fit(){if(innerWidth<=500){w.style.transform='';w.style.marginBottom='';return}
  const s=Math.min(1,(innerHeight-70)/932,(innerWidth-40)/430);w.style.transform=`scale(${s})`;w.style.marginBottom=`${-(932*(1-s))}px`}
  fit();addEventListener('resize',fit)})();
</script>
<script>
/* iOS home-screen mode: fill the whole physical screen, including the area behind the home indicator */
(function(){function setH(){var h=innerHeight,de=document.documentElement;
  var portrait=innerHeight>=innerWidth, sh=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
  var sa=(navigator.standalone||matchMedia('(display-mode: standalone)').matches)&&innerWidth<=500;
  var gap=sa?Math.max(0,sh-h):0;
  de.style.setProperty('--app-h',h+'px');de.style.setProperty('--gap',gap+'px');de.classList.toggle('gapfix',gap>8)}
  setH();addEventListener('resize',setH);addEventListener('orientationchange',function(){setTimeout(setH,300)});
  addEventListener('scroll',function(){if(scrollY)scrollTo(0,0)});
  /* hidden diagnostics: triple-tap "Total balance" */
  var taps=0,tt;document.querySelector('.bal-label').addEventListener('click',function(e){if(e.target.closest('button'))return;taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},600);
    if(taps<3)return;taps=0;var d=document.querySelector('.dbg');if(d){d.remove();return}
    d=document.createElement('div');d.className='dbg';var pr=document.createElement('i');pr.style.cssText='position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:0;width:0';document.body.appendChild(pr);
    var r=pr.getBoundingClientRect(),ph=document.getElementById('phone').getBoundingClientRect(),nv=document.querySelector('.nav').getBoundingClientRect();pr.remove();
    d.textContent='standalone: '+(navigator.standalone||matchMedia('(display-mode: standalone)').matches)+'\ninner: '+innerWidth+'×'+innerHeight+'\nscreen: '+screen.width+'×'+screen.height+'\nvisualViewport: '+(window.visualViewport?Math.round(visualViewport.height):'-')+'\nsafe top/bottom: '+Math.round(r.top)+' / '+Math.round(innerHeight-r.bottom)+'\ngap: '+getComputedStyle(document.documentElement).getPropertyValue('--gap')+'\n--app-h: '+getComputedStyle(document.documentElement).getPropertyValue('--app-h')+'\nphone: '+Math.round(ph.top)+'…'+Math.round(ph.bottom)+'\nnav: '+Math.round(nv.top)+'…'+Math.round(nv.bottom);
    document.body.appendChild(d)})})();
</script>
